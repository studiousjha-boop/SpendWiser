<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logging out — SpendWiser</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .logout-loading {
            min-height: 60vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--auth-bg, #f8f9fa);
            margin-top: 80px;
        }

        .logout-loader {
            text-align: center;
            padding: 3rem;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            max-width: 400px;
            margin: 0 auto;
        }

        .logout-spinner {
            width: 40px;
            height: 40px;
            margin: 0 auto 1rem;
            border: 4px solid var(--border-color, #e9ecef);
            border-top-color: var(--primary-color, #2c3e50);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .logout-message {
            color: var(--text-secondary, #6c757d);
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
        }

        .logout-submessage {
            color: var(--text-tertiary, #adb5bd);
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="logout-loading">
        <div class="logout-loader">
            <div class="logout-spinner"></div>
            <h2 class="logout-message">Logging you out...</h2>
            <p class="logout-submessage">Clearing your session securely.</p>
        </div>
    </div>

    <script>
        // Make logout page display for 1.5 seconds to allow spinner animation
        // This provides a visual indication that logout is in progress
        setTimeout(() => {
            window.location.href = '/';
        }, 1500);
    </script>
</body>
</html>
